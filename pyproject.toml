[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "이진현", email = "jinhyun4622@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "ddgs>=9.16.0",
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.143.2",
    "google-genai>=2.29.0",
    "gradio>=6.30.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.1",
    "langchain-redis>=0.2.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli[inmem]>=0.4.35",
    "markdownify>=1.2.3",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "openai>=3.26.0",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "pydub>=0.25.1",
    "pykrx>=1.2.9",
    "pypdf>=6.21.1",
    "python-chess>=1.999",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "redis>=8.1.0",
    "setuptools<81",
    "tavily-python>=0.8.5",
    "wikipedia>=1.4.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.35",
]
